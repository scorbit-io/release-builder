name: Create pull request

inputs:
  token:
    description: Token used to create the pull request and push the release branch. Defaults to the workflow GITHUB_TOKEN (opens PRs as github-actions[bot]).
    required: false
    default: ${{ github.token }}
  next-version:
    required: true
  notes:
    required: true
  previous-version:
    required: true
  release:
    required: true

runs:
  using: "composite"
  steps:
    - run: |
        echo -e "# Changelog\n" > NEXT.md
        echo -e "All notable changes to this project will be documented in this file. See [standard-version](${SERVER_URL}/conventional-changelog/standard-version) for commit guidelines.\n" >> NEXT.md
        echo -e "${HEADING} [${NEXT_VERSION}](${SERVER_URL}/${REPO}/compare/${PREV_VERSION}...v${NEXT_VERSION}) ($(date +'%Y-%m-%d'))\n" >> NEXT.md
        echo -e "${RELEASE_NOTES}\n" >> NEXT.md
        cat CHANGELOG.md | sed -e '1,4d' >> NEXT.md && mv NEXT.md CHANGELOG.md
      shell: bash
      env:
        SERVER_URL: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        NEXT_VERSION: ${{ inputs.next-version }}
        PREV_VERSION: ${{ inputs.previous-version }}
        HEADING: ${{ inputs.release == 'patch' && '###' || '##' }}
        RELEASE_NOTES: ${{ inputs.notes }}

    - id: commit
      uses: pr-mpt/actions-commit-hash@v3

    - uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ inputs.token }}
        title: Release ${{ inputs.next-version }}
        body: |
          ## Release [${{ inputs.next-version }}](${{ github.server_url }}/${{ github.repository }}/compare/${{ inputs.previous-version }}...${{ steps.commit.outputs.short }})

          ${{ inputs.notes }}
        author: GitHub <noreply@github.com>
        branch: release
        committer: GitHub <noreply@github.com>
        commit-message: |
          chore(release): ${{ inputs.next-version }}
        delete-branch: true
